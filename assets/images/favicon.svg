<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090e" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#06b6d4" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark base container with soft rounded corners -->
  <rect width="64" height="64" rx="16" fill="url(#bg)"/>
  
  <!-- Subtle glowing gradient tech border -->
  <rect x="1.5" y="1.5" width="61" height="61" rx="14.5" fill="none" stroke="url(#glow)" stroke-width="2.5" opacity="0.9"/>
  
  <!-- Active live status indicator dot -->
  <circle cx="50" cy="14" r="3" fill="#10b981" />
  <circle cx="50" cy="14" r="5" fill="none" stroke="#10b981" stroke-width="1" opacity="0.5" />

  <!-- Monogram AS with high contrast and clean typography -->
  <g filter="url(#shadow)">
    <text x="32" y="43" 
          font-family="system-ui, -apple-system, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" 
          font-weight="900" 
          font-size="28" 
          fill="url(#glow)" 
          text-anchor="middle" 
          letter-spacing="-1.5">AS</text>
  </g>
</svg>
